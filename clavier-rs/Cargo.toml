[package]
name = "clavier-propre"
version = "1.0.0"
edition = "2021"
description = "Désactive les suggestions du clavier physique et la correction automatique de Microsoft Office / LibreOffice pendant les évaluations."
build = "build.rs"

[[bin]]
name = "clavier-propre"
path = "src/main.rs"

[dependencies]
slint = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
